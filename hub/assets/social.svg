<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Grok Build Center">
  <title>Grok Build Center — social card</title>
  <defs>
    <radialGradient id="oglow">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg    { fill: #0B0E13; }
      .ink   { fill: #E8EBF0; }
      .dim   { fill: #8A93A3; }
      .faint { fill: #5E6675; }
      .plate { fill: #141922; }
      .ring  { fill: none; stroke: #242C38; stroke-width: 1; }
      .slot  { fill: #3A4453; }
      .slotH { fill: #5C6880; }
      .off   { fill: #39424F; }
      .hair  { fill: #242C38; }
      @media (prefers-color-scheme: light) {
        .bg    { fill: #F5F7FA; }
        .ink   { fill: #0F1420; }
        .dim   { fill: #626C7D; }
        .faint { fill: #98A1B0; }
        .plate { fill: #EDF0F5; }
        .ring  { stroke: #D8DEE8; }
        .slot  { fill: #C3CBD8; }
        .slotH { fill: #A6B0C1; }
        .off   { fill: #B8C1CE; }
        .hair  { fill: #DFE4EC; }
      }
    </style>
  </defs>

  <rect class="bg" width="1280" height="640"/>

  <g transform="translate(584,120) scale(2.3333)">
    <rect class="plate" x="3.5" y="3.5" width="41" height="41" rx="11"/>
    <rect class="ring"  x="3.5" y="3.5" width="41" height="41" rx="11"/>
    <rect class="slotH" x="10" y="11" width="18" height="5" rx="2.5"/>
    <circle cx="36" cy="13.5" r="7" fill="url(#oglow)"/>
    <circle cx="36" cy="13.5" r="4" fill="#FF6B4A"/>
    <rect class="slot" x="10" y="21.5" width="18" height="5" rx="2.5"/>
    <circle class="off" cx="36" cy="24" r="3.2"/>
    <rect class="slot" x="10" y="32" width="18" height="5" rx="2.5"/>
    <circle class="off" cx="36" cy="34.5" r="3.2"/>
  </g>

  <text x="640" y="308" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="15" letter-spacing="5" class="dim">GROK BUILD</text>

  <text x="640" y="400" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="96" font-weight="700" letter-spacing="-2.6" class="ink">Center</text>

  <rect class="hair" x="560" y="430" width="160" height="1"/>

  <text x="640" y="478" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="24" class="dim">会话卡住了，它主动找你。</text>

  <text x="640" y="518" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="14" letter-spacing="2.2" class="faint">LOG · RESUME · SEARCH · FEISHU</text>

  <text x="640" y="588" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="14" class="faint">github.com/dragon43pp/grok-build-center</text>
</svg>
