<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Grok Build Center">
  <title>Grok Build Center banner</title>
  <defs>
    <radialGradient id="bglow">
      <stop offset="0%"   stop-color="#FF6B4A" stop-opacity="0.60"/>
      <stop offset="55%"  stop-color="#FF6B4A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mglow">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1B2230"/>
      <stop offset="100%" stop-color="#0B0E13"/>
    </linearGradient>
    <style>
      .bg     { fill: #0B0E13; }
      .ink    { fill: #E8EBF0; }
      .dim    { fill: #8A93A3; }
      .faint  { fill: #5E6675; }
      .coral  { fill: #FF6B4A; }
      .plate  { fill: #141922; }
      .ring   { fill: none; stroke: #242C38; stroke-width: 1; }
      .slot   { fill: #3A4453; }
      .slotH  { fill: #5C6880; }
      .off    { fill: #39424F; }
      .hair   { fill: #242C38; }
      .screen { fill: #0E1218; }
      @media (prefers-color-scheme: light) {
        .bg     { fill: #F5F7FA; }
        .ink    { fill: #0F1420; }
        .dim    { fill: #626C7D; }
        .faint  { fill: #98A1B0; }
        .plate  { fill: #EDF0F5; }
        .ring   { stroke: #D8DEE8; }
        .slot   { fill: #C3CBD8; }
        .slotH  { fill: #A6B0C1; }
        .off    { fill: #B8C1CE; }
        .hair   { fill: #DFE4EC; }
        .screen { fill: #E7EBF2; }
      }
    </style>
  </defs>

  <rect class="bg" width="1280" height="420"/>

  <!-- left: nameplate -->
  <g transform="translate(76,88) scale(1.1667)">
    <rect class="plate" x="3.5" y="3.5" width="41" height="41" rx="11"/>
    <rect class="ring"  x="3.5" y="3.5" width="41" height="41" rx="11"/>
    <rect class="slotH" x="10" y="11" width="18" height="5" rx="2.5"/>
    <circle cx="36" cy="13.5" r="7" fill="url(#mglow)"/>
    <circle cx="36" cy="13.5" r="4" fill="#FF6B4A"/>
    <rect class="slot" x="10" y="21.5" width="18" height="5" rx="2.5"/>
    <circle class="off" cx="36" cy="24" r="3.2"/>
    <rect class="slot" x="10" y="32" width="18" height="5" rx="2.5"/>
    <circle class="off" cx="36" cy="34.5" r="3.2"/>
  </g>

  <text x="76" y="192"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="13" letter-spacing="3.6" class="dim">GROK BUILD</text>

  <text x="74" y="254"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="66" font-weight="700" letter-spacing="-1.6" class="ink">Center</text>

  <rect class="hair" x="76" y="278" width="248" height="1"/>

  <text x="76" y="312"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="19" class="dim">会话卡住了，它主动找你。</text>

  <text x="76" y="342"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="12" letter-spacing="1.8" class="faint">LOG · RESUME · SEARCH · FEISHU</text>

  <!-- right: the pager itself -->
  <rect x="740" y="76" width="464" height="268" rx="22" fill="url(#body)"/>
  <rect x="740.5" y="76.5" width="463" height="267" rx="21.5" fill="none" stroke="#2C3546" stroke-width="1"/>

  <rect class="screen" x="758" y="94" width="428" height="204" rx="12"/>
  <rect x="758.5" y="94.5" width="427" height="203" rx="11.5" fill="none" stroke="#242C38" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <circle cx="792" cy="132" r="20" fill="url(#bglow)"/>
    <circle cx="792" cy="132" r="7"  class="coral"/>
    <text x="812" y="137" font-size="14" class="ink">grok</text>
    <text x="1162" y="137" font-size="13" text-anchor="end" class="dim">D:\wx\miniprogram</text>

    <circle cx="792" cy="172" r="4.5" class="off"/>
    <text x="812" y="177" font-size="13" class="dim">codex</text>
    <text x="1162" y="177" font-size="13" text-anchor="end" class="faint">D:\agent-hub</text>

    <circle cx="792" cy="208" r="4.5" class="off"/>
    <text x="812" y="213" font-size="13" class="dim">claude</text>
    <text x="1162" y="213" font-size="13" text-anchor="end" class="faint">~/docs/sales</text>

    <rect class="hair" x="782" y="240" width="380" height="1"/>
    <text x="782" y="266" font-size="12" class="dim">3 sessions</text>
    <text x="1162" y="266" font-size="12" text-anchor="end" class="coral">1 waiting for you</text>
  </g>
</svg>
