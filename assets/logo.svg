<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 76" width="200" height="76" role="img" aria-label="Grok Build Pager">
  <title>Grok Build Pager logo</title>
  <defs>
    <radialGradient id="lglow">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ink   { fill: #E8EBF0; }
      .dim   { fill: #8A93A3; }
      .plate { fill: #141922; }
      .ring  { fill: none; stroke: #242C38; stroke-width: 1; }
      .slot  { fill: #3A4453; }
      .slotH { fill: #5C6880; }
      .off   { fill: #39424F; }
      @media (prefers-color-scheme: light) {
        .ink   { fill: #0F1420; }
        .dim   { fill: #626C7D; }
        .plate { fill: #EDF0F5; }
        .ring  { stroke: #D8DEE8; }
        .slot  { fill: #C3CBD8; }
        .slotH { fill: #A6B0C1; }
        .off   { fill: #B8C1CE; }
      }
    </style>
  </defs>

  <g transform="translate(0,6) scale(1.3333)">
    <rect class="plate" x="3.5" y="3.5" width="41" height="41" rx="11"/>
    <rect class="ring"  x="3.5" y="3.5" width="41" height="41" rx="11"/>
    <rect class="slotH" x="10" y="11" width="18" height="5" rx="2.5"/>
    <circle cx="36" cy="13.5" r="7" fill="url(#lglow)"/>
    <circle cx="36" cy="13.5" r="4" fill="#FF6B4A"/>
    <rect class="slot" x="10" y="21.5" width="18" height="5" rx="2.5"/>
    <circle class="off" cx="36" cy="24" r="3.2"/>
    <rect class="slot" x="10" y="32" width="18" height="5" rx="2.5"/>
    <circle class="off" cx="36" cy="34.5" r="3.2"/>
  </g>

  <text x="74" y="33"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="11" letter-spacing="3.4" class="dim">GROK BUILD</text>

  <text x="73" y="66"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="34" font-weight="700" letter-spacing="-0.8" class="ink">Pager</text>
</svg>
