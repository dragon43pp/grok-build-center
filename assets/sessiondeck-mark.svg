<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="SessionDeck">
  <title>SessionDeck mark</title>
  <style>
    .plate { fill: #14181F; }
    .bar   { fill: #59637A; }
    .l0    { fill: #F5A623; }
    .l1    { fill: #FF6B4A; }
    .l2    { fill: #34D399; }
    .l3    { fill: #4C9AFF; }
    @media (prefers-color-scheme: light) {
      .plate { fill: #EEF1F6; }
      .bar   { fill: #A8B2C6; }
    }
  </style>

  <rect class="plate" x="4" y="5" width="40" height="38" rx="9"/>

  <g>
    <rect class="bar" x="10" y="13" width="20" height="4" rx="2"/>
    <rect class="bar" x="10" y="21" width="20" height="4" rx="2"/>
    <rect class="bar" x="10" y="29" width="20" height="4" rx="2"/>
    <rect class="bar" x="10" y="37" width="12" height="4" rx="2"/>
  </g>

  <g>
    <circle class="l0" cx="36" cy="15" r="2.7"/>
    <circle class="l1" cx="36" cy="23" r="2.7"/>
    <circle class="l2" cx="36" cy="31" r="2.7"/>
    <circle class="l3" cx="36" cy="39" r="2.7"/>
  </g>
</svg>
